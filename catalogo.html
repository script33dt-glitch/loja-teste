<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Catálogo — Casa Ateliê</title>
<link rel="stylesheet" href="/assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
  <div class="container row">
    <a href="/index.html" class="logo">Casa Ateliê</a>
    <nav class="main-nav">
      <a href="/index.html">Início</a>
      <a href="/catalogo.html" class="active">Catálogo</a>
      <a href="/minha-conta.html">Minha conta</a>
      <a href="/carrinho.html" class="cart-link">Carrinho <span class="cart-badge">0</span></a>
    </nav>
  </div>
</header>

<section class="container section">
  <h1>Catálogo</h1>

  <div class="field" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px;">
    <input id="search" placeholder="Buscar produtos..." style="max-width:280px;" />
    <select id="category-filter" style="max-width:220px;">
      <option value="">Todas as categorias</option>
    </select>
  </div>

  <div id="grid" class="grid cols-4">
    <p class="muted">Carregando produtos...</p>
  </div>
</section>

<footer class="site-footer">
  <div class="container">Casa Ateliê — loja de demonstração para apresentação a clientes.</div>
</footer>

<script type="module">
  import { supabase } from "/assets/js/supabase-client.js";
  import { formatBRL, updateCartBadge } from "/assets/js/utils.js";

  updateCartBadge();

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("search");
  const categorySelect = document.getElementById("category-filter");

  let allProducts = [];

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const cat = categorySelect.value;
    const filtered = allProducts.filter((p) => {
      const matchesQ = !q || p.name.toLowerCase().includes(q);
      const matchesCat = !cat || p.category_id === cat;
      return matchesQ && matchesCat;
    });
    grid.innerHTML = filtered.length
      ? filtered.map((p) => `
        <a class="product-card" href="/produto.html?slug=${p.slug}">
          <img src="${p.images[0] ?? ''}" alt="${p.name}" loading="lazy" />
          <div class="name">${p.name}</div>
          <div class="price">
            ${p.compare_at_cents ? `<span class="compare">${formatBRL(p.compare_at_cents)}</span>` : ""}
            ${formatBRL(p.price_cents)}
          </div>
        </a>
      `).join("")
      : `<p class="muted">Nenhum produto encontrado.</p>`;
  }

  const [{ data: products, error }, { data: categories }] = await Promise.all([
    supabase.from("products").select("id,name,slug,price_cents,compare_at_cents,images,category_id").eq("active", true).order("name"),
    supabase.from("categories").select("id,name").order("name"),
  ]);

  if (error) {
    grid.innerHTML = `<p class="muted">Não foi possível carregar os produtos.</p>`;
  } else {
    allProducts = products;
    (categories ?? []).forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      categorySelect.appendChild(opt);
    });
    render();
  }

  searchInput.addEventListener("input", render);
  categorySelect.addEventListener("change", render);
</script>
</body>
</html>
